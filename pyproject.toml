[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrf-spectrum-analyzer"
version = "0.2.0"
description = "Auditable Poisson XRF element identification and apparent relative areal density"
requires-python = ">=3.8"
dependencies = ["numpy>=1.23,<2", "scipy>=1.8,<2", "pandas>=1.4,<3", "matplotlib>=3.5,<4", "xraylib>=4.1,<5"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]

[project.scripts]
xrf-analyze = "xrf_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
